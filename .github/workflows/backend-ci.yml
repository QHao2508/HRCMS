name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HorseClub.slnx
      - name: Build
        run: dotnet build HorseClub.slnx --configuration Release --no-restore
      - name: Integration tests
        run: dotnet test HorseClub.slnx --configuration Release --no-build --logger trx --results-directory TestResults
