name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HorseClub.slnx
      - name: Build
        run: dotnet build HorseClub.slnx --configuration Release --no-restore

  sqlserver-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          # Disposable CI container only; never use this credential for deployment.
          MSSQL_SA_PASSWORD: HrcmsCiOnly_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HrcmsCiOnly_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      HRCMS_TEST_SQLSERVER: 'Server=localhost,1433;User ID=sa;Password=HrcmsCiOnly_2026!;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HorseClub.slnx
      - name: Build
        run: dotnet build HorseClub.slnx --configuration Release --no-restore
      - name: SQL Server workflows and concurrency
        run: dotnet test HorseClub.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Report failed tests
        # Ghi test lỗi vào trang Summary của lần chạy (xem được mà không cần mở log).
        if: failure()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          print('## Failed tests')
          for path in glob.glob('TestResults/**/*.trx', recursive=True):
              for result in ET.parse(path).getroot().iterfind('.//t:UnitTestResult', ns):
                  if result.get('outcome') != 'Failed':
                      continue
                  message = result.find('.//t:Message', ns); stack = result.find('.//t:StackTrace', ns)
                  print(f"### {result.get('testName')}")
                  print('```')
                  print((message.text or '')[:4000] if message is not None else '')
                  print((stack.text or '')[:3000] if stack is not None else '')
                  print('```')
          PY
      - name: Upload SQL Server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
