<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #f4f7f6;">
        <tr><td align="center">
            <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0" style="width: 100%; max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left;">
                <tr><td style="background-color: #0056b3; padding: 25px 20px; text-align: center;">
                    <h1 style="color: #ffffff; margin: 0; font-size: 26px; font-weight: bold; letter-spacing: 1px;">HRCMS</h1>
                </td></tr>
                <tr><td style="padding: 40px 30px; color: #333333; line-height: 1.6;">
                    <h2 style="font-size: 22px; margin-top: 0; color: #2c3e50;">{{TITLE}}</h2>
                    <p style="font-size: 16px;">Chào bạn,</p>
                    {{CONTENT}}
                    <div style="text-align: center; margin: 35px 0;">
                        <span style="display: inline-block; padding: 15px 24px; font-size: 36px; font-weight: bold; color: #0056b3; background-color: #f0f8ff; border: 2px dashed #0056b3; border-radius: 8px; letter-spacing: 8px; white-space: nowrap;">{{OTP_CODE}}</span>
                    </div>
                    <div style="background-color: #fff9e6; border-left: 4px solid #f1c40f; padding: 15px; margin-bottom: 20px;">
                        <p style="margin: 0 0 5px 0; font-size: 15px;"><strong>Lưu ý quan trọng:</strong></p>
                        <ul style="margin: 0; padding-left: 20px; color: #555555; font-size: 14px;">{{NOTES}}</ul>
                    </div>
                    <p style="font-size: 14px; color: #7f8c8d; margin-top: 25px; border-top: 1px solid #eeeeee; padding-top: 20px;">{{DISCLAIMER}}</p>
                </td></tr>
                <tr><td style="background-color: #f9f9f9; padding: 20px; text-align: center; font-size: 13px; color: #667580;">
                    <p style="margin: 0;">Email này được gửi tự động từ hệ thống <strong>HRCMS</strong>.<br>Vui lòng không trả lời email này.</p>
                </td></tr>
            </table>
        </td></tr>
    </table>
</body>
</html>
